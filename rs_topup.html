<div class="modalback" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalbody"></div></div><div class="toast" id="toast"></div>
<script>
const products=[
{title:'FF TopUp (BD)',visual:'🪖',art:'FF UID',sub:'UID DIAMONDS',yellow:true},
{title:'Free Dice Spin',visual:'🎲',art:'DICE ROLL',sub:'LUCKY SPIN'},
{title:'Weekly Lite (BD Server)',visual:'💎',art:'WEEKLY LITE',sub:'WEEKLY LITE',yellow:true},
{title:'FF LIKE',visual:'👍',art:'FF LIKE',sub:'LIKE SERVICE',yellow:true},
{title:'WEEKLY',visual:'💎',art:'WEEKLY',sub:'WEEKLY MEMBERSHIP'},
{title:'Weekly/Monthly Offer',visual:'💳',art:'WEEKLY / MONTHLY',sub:'SPECIAL OFFER',yellow:true},
{title:'New Level Up Pass',visual:'🧑‍🎤',art:'LEVEL UP PASS',sub:'LEVEL UP'},
{title:'MONTHLY',visual:'💳',art:'MONTHLY',sub:'MONTHLY MEMBERSHIP'},
{title:'Indonesia Server (UID)',visual:'🎮',art:'INDONESIA',sub:'UID TOP UP'},
{title:'UniPin Voucher',visual:'🎟️',art:'UNIPIN',sub:'VOUCHER'}
];
const cards=document.getElementById('cards');products.forEach((p,i)=>{cards.insertAdjacentHTML('beforeend',`<article class="product" onclick="openProduct(${i})"><div class="art"><div class="tag">✦ AI DELIVERY ✦</div><div class="symbol">${p.visual}</div><div class="artname ${p.yellow?'yellow':''}">${p.art}</div></div><div class="caption">${p.title}</div></article>`)});
function openProduct(i){let p=products[i];document.getElementById('modalbody').innerHTML=`<h2>${p.title}</h2><p>Demo product details</p><div class="notice">এটি একটি UI demo। এখানে কোনো বাস্তব top-up বা payment হবে না।</div><label>Player UID / Account ID</label><input placeholder="Player UID (demo only)" inputmode="numeric"><label>Package</label><select id="pack" style="width:100%;padding:12px;border:1px solid #ccd4e0;border-radius:10px"><option>Choose a demo package</option><option>Small Pack — Demo</option><option>Standard Pack — Demo</option><option>Large Pack — Demo</option></select><button onclick="showToast('Demo only — order/payment disabled')">Continue (Demo)</button><button class="close" onclick="closeModal()">Close</button>`;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}function nav(t){if(t==='Home'){document.querySelectorAll('.navitem').forEach(x=>x.classList.remove('active'));document.querySelector('.navitem').classList.add('active');showToast('Home')}else if(t==='Add Money'){document.getElementById('modalbody').innerHTML=`<h2>Add Money</h2><div class="notice">Demo wallet — real payments are not connected.</div><p>Wallet balance: ৳0</p><button class="close" onclick="closeModal()">Close</button>`;document.getElementById('modal').style.display='flex'}else{document.getElementById('modalbody').innerHTML=`<h2>${t}</h2><div class="notice">${t} page is demo-only. No account/order/payment data is stored.</div><button class="close" onclick="closeModal()">Close</button>`;document.getElementById('modal').style.display='flex'}}
let toastTimer;function showToast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2300)}
</script></body></html>
